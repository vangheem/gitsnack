[package]
name = "gitsnack"
version = "0.6.0"
edition = "2024"
description = "Native GitHub PR review app with opencode agent sessions"
license = "MIT"
repository = "https://github.com/vangheem/gitsnack"

[dependencies]
anyhow = "1"
base64 = "0.22"
rune = { git = "https://github.com/vangheem/rune", rev = "ee055d312ad958f937fa715616e336bfabce2f09" }
rune-kit = { git = "https://github.com/vangheem/rune", rev = "ee055d312ad958f937fa715616e336bfabce2f09", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/vangheem/rune", rev = "ee055d312ad958f937fa715616e336bfabce2f09" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSRunningApplication", "libc"] }
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
