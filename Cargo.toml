[package]
name = "gitsnack"
version = "0.4.1"
edition = "2024"
description = "Native GitHub PR review app with opencode agent sessions"
license = "MIT"
repository = "https://github.com/vangheem/gitsnack"

[dependencies]
anyhow = "1"
base64 = "0.22"
rune = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
